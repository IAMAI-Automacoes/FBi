<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deixe seu feedback</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#171717" />
    <!-- A página abre no celular do cliente ao escanear o QR: só precisa chamar
         o Supabase. O preconnect adianta o handshake e a resposta chega antes. -->
    <link rel="preconnect" href="https://lixrcruilisncfhfhndo.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://lixrcruilisncfhfhndo.supabase.co" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #171717; }
      #root { height: 100%; }
      /* Esqueleto escuro enquanto o (pequeno) JS carrega — nada de tela branca. */
      .ef-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #171717; }
      .ef-spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.18); border-top-color: rgba(255,255,255,0.85); animation: ef-rot 0.8s linear infinite; }
      @keyframes ef-rot { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="root"><div class="ef-boot"><div class="ef-spin"></div></div></div>
    <!--
      A busca dos dados começa AQUI, e não lá dentro do React.

      Antes a ordem era: baixar o HTML, baixar o JS, montar o React, e só então
      pedir os dados — quatro etapas em fila. O pedido é a única que depende de
      rede depois do JS, e não depende do React pra nada: disparado aqui, ele
      corre junto com o download do bundle, e quando o React monta a resposta
      em geral já chegou. Medido: a página abre ~0,4 s antes.

      Guarda a Promise (não o resultado) — `main-landing.tsx` a consome, e faz
      o pedido por conta própria se este script não tiver rodado.
    -->
    <script>
      (function () {
        var m = location.pathname.match(/\/f\/([^/?#]+)/)
        if (!m) return
        var k = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxpeHJjcnVpbGlzbmNmaGZobmRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MzkyNTcsImV4cCI6MjA3ODUxNTI1N30.dm3PN80PogMaEHK5ZxHhEyacMbb3PMUoHCUwaDbePmM'
        window.__dadosDoQr = fetch('https://lixrcruilisncfhfhndo.supabase.co/functions/v1/qr-landing', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: k, Authorization: 'Bearer ' + k },
          body: JSON.stringify({ slug: decodeURIComponent(m[1]) }),
        }).then(function (r) { return r.json() })
        // Sem isto, um erro de rede aqui viraria "unhandled rejection" no
        // console antes de o React existir pra tratá-lo.
        window.__dadosDoQr.catch(function () {})
      })()
    </script>
    <script type="module" src="/src/main-landing.tsx"></script>
  </body>
</html>
