server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota do React (ex.: /admin, /feedbacks) cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker e index sempre frescos → atualização do app pega rápido,
  # sem servir bundle velho de cache.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Manifests com content-type correto (PWA).
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Assets com hash no nome (JS/CSS/imagens do build): cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
